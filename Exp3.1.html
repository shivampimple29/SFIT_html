<!DOCTYPE html>
<html>
<head>
<title>2D Transform</title>
<style>
div{
background-color:Gold;
width:20%;
height:50px;
justify-content:center;
align-items:center;
text-align:center;
color:blue;
display:flex;
}

#div1{
transform:translate(300px,10px);
}

#div2{
transform:translate(600px,20px) rotate(30deg);
}

#div3{
Transform :translate(900px,150px) scale(2,3);
}

#div4{
Transform :translate(1200px,300px) skew(60deg);
}

#div5{
Transform : matrix(2,0.5,0.5,2,75,100);
}
</style>
</head>
<body>
<div>
This is normal div!
</div>

<div  id="div1">Application of translate(300px,10px)
</div>

<div  id="div2">Application of rotate(30deg)
</div>

<div  id="div3">Application of scale(2,3)
</div>

<div  id="div4">Application of skew(60deg)
</div>

<div  id="div5">Application of matrix(2,0.5,0.5,2,75,100)
</div>
</body>
</html>
