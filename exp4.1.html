<!DOCTYPE html>
<html>
<head>
<title>Registration Form using HTML & CSS</title>
<style>

body {
	display: flex;
	justify-content: center;
	align-items: center;
	min-height: 100vh; 
	margin: 0;
	background-color: gold; 
}

div {
	background-color: #004225;
	padding: 20px;
	margin: 20px;
	border-radius: 5px;
	text-align: center;
	width: 40%;
	color: gold;
	box-shadow: 0 0 10px rgba(0,0,0,0.5); 
}
input {
	width: 90%;
	padding: 5px;
	margin: 5px 0;
	border: 1px solid white;
	background: transparent;
	color: gold;
}

button {
	background-color: #ffffff;
	color: #311b92;
	padding: 10px;
	border: none;
	border-radius: 5px;
}
button:hover {
	background-color: gold;
	color: #311b92;
}
</style>
</head>
<body>
<div>
<h2>REGISTRATION FORM</h2>
<form>
First name  :<input type="text" id="fname" name="fname" placeholder="Enter Your First Name" required><br><br>
Last name   :<input type="text" id="lname" name="lname" placeholder="Enter Your Last Name" required><br><br>
Birth date  :<input type="date" id="DOB" name="DOB" placeholder="Enter Your Birthdate" required><br><br>
E-mail      :<input type="email" id="email" name="email" placeholder="Enter Your E-mail" required><br><br>
Phone number:<input type="tel" id="PhNO" name="PhNO" pattern="\+91[0-9]{10}" placeholder="+91XXXXXXXXXXX" required><br><br>

Gender:<select id="Gender" name="Gender">
	<option value="G0">Gender</option>
	<option value="G1">Male</option>
	<option value="G2">Female</option></select><br><br><br><br><br><br>
	<button type="submit">Submit</button>
</form>
</div>
</body>
</html>
