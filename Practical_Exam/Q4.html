<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bouncing Ball Animation</title>
  <style>
    body {
      background-color: skyblue;
      display: flex;
      justify-content: left;
      align-items: left;
      width:20vh;
      margin: 0;
    }

    .ball {
      width: 100px;
      height: 100px;
      background-color:yellow;
      border-radius: 50%;
      position: relative;
      animation: bounce 2s infinite ease-in-out;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
    }

    @keyframes bounce {
      0%, 100% {
        left: 0;
      }
      50% {
        left: 1200px;
      }
    }
  </style>
</head>
<body>
  <div class="ball"></div>
</body>
</html>
