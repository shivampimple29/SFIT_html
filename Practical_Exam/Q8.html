<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Inline Styled Form</title>
</head>
<body style="background-color: #fefbd8; font-family: 'Arial', sans-serif; padding: 30px;">

  <h2 style="color: #3e4a61; text-align: center;">User Registration Form</h2>

  <form style="background-color: #fff; padding: 20px; border-radius: 10px; width: 350px; margin: auto; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">

    <label style="font-size: 1.1em; color: #333;">First Name:</label><br>
    <input type="text" name="firstname" style="width: 100%; padding: 8px; margin-bottom: 15px; font-size: 1em;"><br>

    <label style="font-size: 1.1em; color: #333;">Last Name:</label><br>
    <input type="text" name="lastname" style="width: 100%; padding: 8px; margin-bottom: 15px; font-size: 1em;"><br>

    <label style="font-size: 1.1em; color: #333;">Dont be a racist!:</label><br>
    <input type="radio" name="gender" value="female" style="margin-right: 5px;">Hate Equally!<br><br>

    <label style="font-size: 1.1em; color: #333;">Compliments for Radha:</label><br>
    <select name="country" style="width: 100%; padding: 8px; font-size: 1em;">
      <option value="india">Beautiful</option>
      <option value="usa">Genius</option>
      <option value="canada">Grogeous</option>
      <option value="australia">Relastic and Rational</option>
    </select><br><br><br><br><br><br><br><br>

    <input type="submit" value="Submit" style="background-color: #4CAF50; color: white; border: none; padding: 10px 15px; font-size: 1em; cursor: pointer; border-radius: 5px;">

  </form>

</body>
</html>
