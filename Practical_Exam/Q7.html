<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lists and Image Example</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f8ff;
      padding: 30px;
      color: #333;
    }

    h1 {
      color: #2c3e50;
    }

    img {
      width: 300px;
      height: auto;
      border-radius: 10px;
      margin-top: 20px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s ease;
    }

    img:hover {
      transform: scale(1.05);
    }

    .list-section {
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <h1>Welcome to My Web Page</h1>

  <div class="list-section">
    <h2>My Daily Routine (Ordered List)</h2>
    <ol>
      <li>Wake up</li>
      <li>Exercise</li>
      <li>Study</li>
      <li>Work on projects</li>
      <li>Relax and sleep</li>
    </ol>
  </div>

  <div class="list-section">
    <h2>My Favorite Foods (Unordered List)</h2>
    <ul>
      <li>Pizza</li>
      <li>Ice Cream</li>
      <li>Sushi</li>
      <li>Chole Bhature</li>
    </ul>
  </div>

  <h2>Visit My Favorite Website</h2>
  <a href="https://www.wikipedia.org" target="_blank">
    <img src="https://upload.wikimedia.org/wikipedia/commons/6/63/Wikipedia-logo.png" 
         alt="Wikipedia Logo">
  </a>

</body>
</html>
