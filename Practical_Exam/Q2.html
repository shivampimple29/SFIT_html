<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My College</title>
  <style>
    body {
      margin: 0;
      background-image: url('https://images.unsplash.com/photo-1503676260728-1c00da094a0b');
      background-size: cover;
      background-position: center;
      color: white;
      font-family: Arial, sans-serif;
    }

    .overlay {
      background-color: rgba(0, 0, 0, 0.6); /* Dark overlay for text readability */
      padding: 40px;
      height: 100vh;
    }

    .college-name {
      font-size: 3em;
      font-weight: bold;
      text-align: center;
      margin-bottom: 10px;
      color: #ffcc00;
    }

    .address {
      font-size: 1.2em;
      text-align: center;
      margin-bottom: 30px;
      color: #ccc;
    }

    .courses {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      font-size: 1.5em;
    }

    .course1 { color: #FF6347; font-family: 'Georgia', serif; }
    .course2 { color: #7FFFD4; font-family: 'Courier New', monospace; }
    .course3 { color: #FFD700; font-family: 'Tahoma', sans-serif; }
    .course4 { color: #ADFF2F; font-family: 'Lucida Console', monospace; }

    marquee {
      margin-top: 30px;
      font-size: 1.3em;
      color: #00ffff;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="college-name">Sunrise Institute of Technology</div>
    <div class="address">123 Learning Lane, Knowledge City, EduState - 456789</div>

    <div class="courses">
      <div class="course1">B.Sc Computer Science</div>
      <div class="course2">B.A English Literature</div>
      <div class="course3">B.Com Finance</div>
      <div class="course4">BBA Management</div>
    </div>

    <marquee >Admissions Open for 2025-2026 | Apply Now!</marquee>
  </div>
</body>
</html>
