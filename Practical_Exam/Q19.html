<!DOCTYPE html>
<html>
<head>
  <title>Simple Job Application Form</title>
</head>
<body>

<h2>Job Application Form</h2>

<form onsubmit="return validateForm()">

  Name: <br>
  <input type="text" id="name"><br><br>

  Email: <br>
  <input type="text" id="email"><br><br>

  Gender: <br>
  <input type="radio" name="gender" value="Male"> Male
  <input type="radio" name="gender" value="Female"> Female<br><br>

  Skills: <br>
  <input type="checkbox" name="skills" value="HTML"> HTML
  <input type="checkbox" name="skills" value="CSS"> CSS
  <input type="checkbox" name="skills" value="JS"> JavaScript<br><br>

  Mobile Number: <br>
  <input type="text" id="mobile"><br><br>

  <input type="submit" value="Submit">
</form>

<script>
function validateForm() {
  let name = document.getElementById("name").value;
  let email = document.getElementById("email").value;
  let mobile = document.getElementById("mobile").value;
  let gender = document.querySelector('input[name="gender"]:checked');
  let skills = document.querySelectorAll('input[name="skills"]:checked');

  if (!name || !email || !mobile || !gender || skills.length == 0) {
    alert("All fields are required.");
    return false;
  }

  if (!email.includes("@") || !email.includes(".")) {
    alert("Invalid email format.");
    return false;
  }

  if (mobile.length !== 10 || isNaN(mobile)) {
    alert("Mobile number must be 10 digits.");
    return false;
  }

  alert("Form submitted successfully!");
  return true;
}
</script>

</body>
</html>
