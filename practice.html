<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stylish Web Page</title>
  <style>
    body {
      background-color: #f0f8ff; /* Light attractive background */
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
      margin: 0;
    }

    .container {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .content {
      width: 60%;
    }

    h1 {
      font-size: 2em;
      color: #6a0dad; /* Purple color */
      font-family: 'Georgia', serif;
    }

    p {
      font-size: 1.1em;
      color: #333;
      font-family: 'Verdana', sans-serif;
    }

    .image-container img {
      width: 300px;
      height: auto;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    hr {
      border: 0;
      height: 2px;
      background: #6a0dad;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="content">
      <h1><b><i><u>Welcome to My Stylish Web Page!</u></i></b></h1>
      <hr>
      <p>This is a sample paragraph with a modern font and color scheme. I'm using different font styles and a pleasing background to make this web page look impressive and user-friendly. Hope you enjoy the design!</p>
    </div>
    <div class="image-container">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT1fYUJTGP_7VICM1ogQKKOLASmTGkRWfXM3g&s" alt="Decorative Image">
    </div>
  </div>
</body>
</html>
